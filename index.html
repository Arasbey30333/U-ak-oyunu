<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shadow District</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <span class="brand-badge">S</span>
          <div>
            <div class="eyebrow">OPEN CITY</div>
            <h1>Shadow District</h1>
          </div>
        </div>
        <div class="profile-box">
          <span class="avatar">K</span>
          <span>Kaan</span>
        </div>
      </header>

      <div class="hud">
        <div class="stat"><span>Cash</span><strong id="cash">$0</strong></div>
        <div class="stat"><span>Heat</span><strong id="heat">0</strong></div>
        <div class="stat"><span>HP</span><strong id="hp">100</strong></div>
        <div class="stat"><span>Target</span><strong id="missionText">Find Package</strong></div>
      </div>

      <div class="canvas-wrap">
        <canvas id="gameCanvas" width="920" height="560"></canvas>
        <div class="mission-toast" id="toast"></div>
      </div>

      <div class="controls">
        <div class="keys">
          <span>Move: WASD / Arrows</span>
          <span>Enter Car: E</span>
          <span>Boost: Shift</span>
        </div>
        <button id="startBtn" type="button">Start Mission</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
