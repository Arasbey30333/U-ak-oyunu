<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uçak Oyunu</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-shell">
      <h1>Uçak Oyunu</h1>

      <div class="hud">
        <div>Skor: <span id="score">0</span></div>
        <div>Can: <span id="lives">3</span></div>
      </div>

      <canvas id="gameCanvas" width="420" height="640" aria-label="Uçak oyunu alanı"></canvas>

      <div class="actions">
        <button id="startBtn">Başlat</button>
        <button id="restartBtn" class="secondary">Yeniden Başla</button>
      </div>

      <p class="help">Kontrol: Sol/Sağ Oklar veya A/D, Ateş etmek için Boşluk</p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
